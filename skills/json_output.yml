name: json_output
description: "JSON 输出格式硬约束"
applies_to:
  - process_note
rules:
  - "只输出一个合法 JSON 对象，不得输出 JSON 以外的任何文字、解释或 markdown 代码块包裹"
  - "JSON 字符串值内禁止出现原始换行符或制表符；内容中的换行必须写成 \\n 转义序列"
  - "APPEND_TO 只能用于标注为「字符串列表」的 memory 路径，禁止对字符串类型路径使用"
  - "memory_updates 的 path 必须从上方 active_memory 结构列表中原样复制，禁止自创路径，禁止更换域前缀（例如 recovery_activities 属于 wellbeing 域，不能写成 life.recovery_activities）"
